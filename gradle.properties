version=0.1.0-alpha
kotlin.code.style=official
org.gradle.jvmargs=-Xmx3g
org.gradle.caching=true
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.enableCInteropCommonization=true
# Jeder Host baut nur die Targets, deren Cinterop er verarbeiten kann (macOS: macosArm64, linuxX64, mingwX64;
# Windows: mingwX64). Ohne diese Einstellung warnt Kotlin auf Windows wegen posix.def für macosArm64.
kotlin.native.enableKlibsCrossCompilation=false
